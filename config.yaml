# AI PM Agent 全局配置
# 密钥一律通过环境变量读取，不硬编码在此文件

llm:
  default_provider: deepseek
  temperature: 0.3
  max_retries: 2

  # 单次输出 token 上限：
  # 长结构化产物（拆工单/评测体系/发布计划）输出长，留足上限防被截断成半个 JSON；
  # 未配置（删除本行）时不传该参数，保持 provider 默认。
  # 值按真机实测校准：第 7 段真机提示词（19,911 字符）实测输出 31,046 token，
  # 其中隐藏思考占 16,805 token —— 8192 会被思考吃光、正文为空；32768 实测通过（117s，正文 29,429 字符）。
  max_tokens: 32768

  # providers 改为 LiteLLM 模型串格式：
  # litellm_model = "<provider>/<model>"，一个接口适配 OpenAI兼容/Anthropic/Gemini/Ollama 等协议；
  # api_key_env 为密钥所在环境变量名；本地模型（如 ollama）留空字符串 "" 即可。
  providers:
    deepseek:
      litellm_model: "deepseek/deepseek-v4-flash"
      api_key_env: "DEEPSEEK_API_KEY"

    # ── 以下 Provider 为注释模板，按需取消注释启用 ──
    # anthropic:
    #   litellm_model: "anthropic/claude-3-5-sonnet-latest"
    #   api_key_env: "ANTHROPIC_API_KEY"
    # gemini:
    #   litellm_model: "gemini/gemini-2.0-flash"
    #   api_key_env: "GEMINI_API_KEY"
    # ollama-local:
    #   litellm_model: "ollama/qwen2.5"
    #   api_key_env: ""   # 本地模型无密钥，留空字符串
    # ── 旧 base_url + model 格式参考（OpenAI 兼容协议，可用 openai/ 前缀 + api_base 走 LiteLLM）──
    # hunyuan:
    #   litellm_model: "openai/hy3"
    #   api_base: "https://api.hunyuan.cloud.tencent.com/v1"
    #   api_key_env: "HUNYUAN_API_KEY"
    # zhipu:
    #   litellm_model: "openai/glm-4"
    #   api_base: "https://open.bigmodel.cn/api/paas/v4"
    #   api_key_env: "ZHIPU_API_KEY"
    # qwen:
    #   litellm_model: "openai/qwen-plus"
    #   api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    #   api_key_env: "DASHSCOPE_API_KEY"
    # moonshot:
    #   litellm_model: "openai/moonshot-v1-8k"
    #   api_base: "https://api.moonshot.cn/v1"
    #   api_key_env: "MOONSHOT_API_KEY"

kb:
  store_path: ./kb_store
  feishu_app_id: ""
  feishu_app_secret: ""

artifacts:
  output_root: ./output
  template_dir: ./artifacts/templates

persistence:
  db_path: ./ai_pm_agent.db

graph:
  max_prd_revisions: 3
  node_timeout: 120

# 第 8 段：外置评测工具（Promptfoo）路径
# 相对路径以项目根为基准解析；缺失时 eval_run 节点抛 NodeExecutionError 提示配置缺失
eval_tools:
  promptfoo_dir: ./工具与参考/Agent外置工具包/AI评测工具包/tools/promptfoo

# 第 6 段：对比选型候选模型清单（横跑范围）
# 第一版只放 DeepSeek 自家两个模型，零新密钥零第三方端点（产品渠道干净红线）；
# 以后加厂商只在本清单加行（id/label/kind/api_key_env），代码零改。
# key 只放 .env（api_key_env 为环境变量名，不硬编码）；Promptfoo deepseek provider 原生读该变量。
bake_off:
  candidates:
    - id: deepseek:deepseek-chat
      label: DeepSeek-Chat
      kind: chat
      api_key_env: DEEPSEEK_API_KEY
    - id: deepseek:deepseek-reasoner
      label: DeepSeek-Reasoner
      kind: reasoner
      api_key_env: DEEPSEEK_API_KEY

# 工具能力清单路径（判断需求与AI的边界段注入 prompt）
tool_catalog:
  routing_md_path: ./references/外置工具路由.md

# 候选池前置（第 2 段产出、第 3 段引用）：
# path = 候选清单整份文本（注入 feasibility_check prompt，模型据此挑 2–5 个候选）；读不到 → 空串、该节不渲染；
# price_script = 实时取价脚本（节点调 sys.executable <脚本> <模型名...> --json，超时 30 秒）；取不到价 → 逐条记「未取到」。
# 相对路径以项目根为基准解析（与 tool_catalog 同口径）。
model_catalog:
  path: ./references/模型候选清单.md
  price_script: ./scripts/model_catalog.py

# 行业追踪（scripts/industry_digest.py）：
# 数据只读复用信源库（source_db，SQLite，自行填入路径；不配则 industry_digest.py 不可用）；产物落 output/行业追踪/；
# 模型走 llm.providers 统一层（判类/提炼用便宜模型，写总结用大模型）。
# 出刊节奏（2026-09-17 用户拍板）：以周为单位（days=7），每期篇数由模型按内容自定（只挑最突出的写），无料不出刊。
industry_digest:
  source_db: ./data/sources/articles.db
  output_root: ./output/行业追踪
  prompt_path: ./src/components/prompts/industry_digest.md
  provider_classify: deepseek
  provider_write: deepseek
  days: 7

# RAG 领域知识库（AI 领域知识库，与业务档案库 kb 段独立）
domain_kb:
  chroma_path: ./domain_kb/chroma
  source_path: ./domain_kb/source

  embedding:
    provider: siliconflow
    model: Qwen/Qwen3-Embedding-8B
    api_key_env: "SILICONFLOW_API_KEY"
    api_base: "https://api.siliconflow.cn/v1"
    dimensions: 4096
    batch_size: 32

  retrieval:
    top_k: 5
    keyword_weight: 0.4
    vector_weight: 0.6
    layer_weights:
      concept: 2.0
      curated-paper: 1.5
      tracked-paper: 1.0
    curated_bonus: 1.2
    feishu_ref_bonus: 1.3
    # 检索条例参数：
    # min_vector_sim = 相关性阈值（vector_sim 低于此值过滤掉；0 = 不过滤，默认宽容）
    # max_per_source = 同一 source 文档最多保留几条（1 = 去重，保证 top_k 覆盖不同来源；
    #                  治 S047 实测「5 条里 4 条同一文档」）
    min_vector_sim: 0.0
    max_per_source: 1

